<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#faf6f0;--panel:#fff;--ink:#2b2420;--muted:#7a6e66;--line:#ebe2d6;--accent:#c4673f;--accent-ink:#fff;--accent-2:#f6e4d9;--sage:#5f8263;--sage-2:#e3ece2;--warn:#9a6412;--warn-2:#fbf0d9;--bad:#b23b3b;--bad-2:#f8e1e1;--blue:#3d6a9c;--blue-2:#e1ebf6;--radius:14px;--shadow:0 1px 2px rgba(60,40,20,.06),0 4px 16px rgba(60,40,20,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1715;--panel:#25201d;--ink:#f1e9e1;--muted:#a99c92;--line:#3a322d;--accent:#e08a62;--accent-ink:#1b1715;--accent-2:#3d2a20;--sage:#93b496;--sage-2:#24302a;--warn:#e0b25a;--warn-2:#3a3020;--bad:#e27a7a;--bad-2:#3d2424;--blue:#8db3de;--blue-2:#1f2a38;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.2;margin:0 0 .4em}
h1{font-size:1.7rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
a{color:var(--accent)}
.app{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:4px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand b{font-family:Fraunces,serif;font-size:1.2rem;display:block}
.brand small{color:var(--muted)}
.nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:9px 10px;border-radius:10px;font:inherit;cursor:pointer}
.nav button:hover{background:var(--accent-2)}
.nav button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav .ico{width:20px;text-align:center}
.side-foot{margin-top:14px;padding:10px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line)}
main{flex:1;min-width:0;padding:26px 28px 80px;max-width:1180px}
.topbar{display:none}
.sub{color:var(--muted);margin:-.2em 0 1.2em}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat b{font-size:1.8rem;font-family:Fraunces,serif;display:block}
.stat span{color:var(--muted);font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=checkbox]{width:auto}
.field{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:10px;font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.big{padding:11px 18px;font-size:1rem}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;font-size:.74rem;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.Threads{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.X{background:var(--blue-2);color:var(--blue);border-color:transparent}
.s-Draft{background:var(--bg)}.s-Reviewed{background:var(--warn-2);color:var(--warn)}.s-Approved{background:var(--sage-2);color:var(--sage)}.s-Scheduled{background:var(--blue-2);color:var(--blue)}.s-Published{background:var(--accent-2);color:var(--accent)}
select.status{width:auto;padding:3px 8px;font-size:.8rem;border-radius:999px;font-weight:600}
.post{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);position:relative}
.post.busy{opacity:.55;pointer-events:none}
.post.busy::after{content:"Working…";position:absolute;top:12px;right:16px;font-weight:600;color:var(--accent)}
.post-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.post-top select{margin-left:auto}
.hook{font-weight:700;margin:0 0 6px;white-space:pre-wrap}
.pbody{margin:0 0 6px;white-space:pre-wrap}
.pcta{margin:0 0 8px;color:var(--accent);white-space:pre-wrap}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-bottom:8px}
.warnchip{background:var(--warn-2);color:var(--warn);border-radius:999px;padding:2px 8px;font-size:.75rem}
.badchip{background:var(--bad-2);color:var(--bad);border-radius:999px;padding:2px 8px;font-size:.75rem}
.okchip{background:var(--sage-2);color:var(--sage);border-radius:999px;padding:2px 8px;font-size:.75rem}
.actions{display:flex;gap:6px;flex-wrap:wrap}
details.menu{position:relative}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
details.menu .drop{position:absolute;z-index:20;top:110%;left:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.15);min-width:210px}
details.menu .drop button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:8px;font:inherit;font-size:.88rem;color:var(--ink);cursor:pointer}
details.menu .drop button:hover{background:var(--accent-2)}
.notice{border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.9rem;background:var(--warn-2);color:var(--warn)}
.notice.info{background:var(--blue-2);color:var(--blue)}
.notice.ok{background:var(--sage-2);color:var(--sage)}
.notice.bad{background:var(--bad-2);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;border:1.5px dashed var(--line);border-radius:var(--radius)}
.mix-row{display:grid;grid-template-columns:190px 1fr 80px;gap:10px;align-items:center;margin:7px 0;font-size:.86rem}
.bar{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:999px;position:relative;overflow:visible}
.bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar i{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);opacity:.5}
.mix-num{text-align:right}.mix-num small{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem}
td input{padding:4px 6px;min-width:60px}
.tablewrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.78rem;color:var(--muted);font-weight:600;padding:0 4px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:120px;padding:6px;font-size:.8rem}
.cal.month .day{min-height:92px}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.out{opacity:.45}
.day.over{background:var(--accent-2)}
.day .dn{font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between}
.chip{display:block;padding:4px 6px;border-radius:7px;margin-bottom:4px;cursor:grab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--line)}
.unsched{margin-top:14px}
.unsched .chip{display:inline-block;max-width:280px;margin:0 6px 6px 0}
.modal-bg{position:fixed;inset:0;background:rgba(20,14,10,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:50;overflow:auto}
.modal{background:var(--panel);border-radius:16px;max-width:720px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:.9rem;max-width:90vw}
.funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.funnel div{background:var(--accent-2);border-radius:12px;padding:10px;font-size:.84rem}
.funnel b{display:block;color:var(--accent)}
.idea{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line)}
.idea:last-child{border-bottom:0}
.idea .num{font-family:Fraunces,Georgia,serif;color:var(--accent);font-weight:700;min-width:28px;padding-top:1px}
.idea .main{flex:1 1 260px;min-width:0}
.idea .main b{font-weight:600}
.progress{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--blue-2);color:var(--blue);margin:12px 0}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 12px;font:inherit;font-size:.88rem;color:var(--ink);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.small{font-size:.82rem;color:var(--muted)}
.kw{display:inline-block;background:var(--sage-2);color:var(--sage);border-radius:999px;padding:1px 8px;font-size:.75rem;margin:2px 3px 0 0}
@media (max-width:900px){
 .side{position:fixed;left:-260px;z-index:40;transition:left .2s;height:100vh}
 .side.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.3)}
 .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
 .app{flex-direction:column}
 main{padding:18px 16px 80px}
 .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
 .mix-row{grid-template-columns:1fr 70px}.mix-row .bar{grid-column:1/-1;grid-row:2}
 .cal{grid-template-columns:1fr}.cal .dow{display:none}.day{min-height:auto}
 .cal.month{grid-template-columns:repeat(7,minmax(0,1fr))}.cal.month .chip{font-size:0;padding:3px;height:8px}
 .funnel{grid-template-columns:1fr}
}
</style>

function salvage(t){
 const out=[];let depth=0,start=-1,inStr=false,esc=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(inStr){if(esc)esc=false;else if(c==='\\')esc=true;else if(c==='"')inStr=false;continue}
  if(c==='"'){inStr=true;continue}
  if(c==='{'){if(depth===0)start=i;depth++}
  else if(c==='}'){depth--;if(depth===0&&start>-1){const ch=t.slice(start,i+1);
   try{out.push(JSON.parse(ch))}catch(e){try{out.push(JSON.parse(ch.replace(/\r?\n/g,'\\n').replace(/,\s*([}\]])/g,'$1')))}catch(e2){}}
   start=-1}}
 }
 return out;
}
function parseJSON(t){
 t=String(t).replace(/```(?:json)?/g,'').trim();
 try{return JSON.parse(t)}catch(e){}
 const a=t.indexOf('['),b=t.lastIndexOf(']'),c=t.indexOf('{'),d=t.lastIndexOf('}');
 if(a>-1&&b>a&&(c===-1||a<c)){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
 if(c>-1&&d>c){try{return JSON.parse(t.slice(c,d+1))}catch(e){}}
 const sv=salvage(t);if(sv.length)return(t.trim()[0]==='{'&&sv.length===1)?sv[0]:sv;
 throw new Error('The AI reply could not be read (it began: "'+t.slice(0,120).replace(/\s+/g,' ')+'…"). Try again.');
}

function newPost(o){return Object.assign({id:uid(),platform:'Threads',lang:'en',pillar:'',hook:'',body:'',cta:'',ctaObjective:'',seo:[],product:'',campaign:'',reuse:'',storyId:'',status:'Draft',date:'',time:'',url:'',metrics:{},batchId:'',pairId:'',createdAt:Date.now(),demo:false},o)}
const matchPillar=n=>(S.pillars.find(p=>p.name.toLowerCase()===String(n||'').toLowerCase())||S.pillars.find(p=>String(n||'').toLowerCase().includes(p.name.toLowerCase().slice(0,12))))?.id||'';
const matchProduct=n=>n?(S.products.find(p=>p.name.toLowerCase()===String(n).toLowerCase())?.id||''):'';
const matchStory=n=>n?(S.stories.find(s=>s.title.toLowerCase()===String(n).toLowerCase())?.id||''):'';
function toPosts(o,f,batchId){
 const base={pillar:matchPillar(o.content_pillar)||(f.pillar!=='mix'?f.pillar:''),lang:f.lang,ctaObjective:o.cta_objective||(f.cta==='Mixed'?'':f.cta),seo:Array.isArray(o.seo_terms)?o.seo_terms.filter(Boolean).slice(0,6):[],product:matchProduct(o.related_product)||'',campaign:f.campaign||'',reuse:o.suggested_reuse||'',storyId:matchStory(o.story_used),batchId};
 const vars=Array.isArray(o.variants)&&o.variants.length?o.variants:[o];
 const pairId=vars.length>1?uid():'';
 return vars.map(v=>newPost(Object.assign({},base,{platform:v.platform==='X'?'X':v.platform==='Threads'?'Threads':(f.platform==='X'?'X':'Threads'),hook:String(v.hook||'').trim(),body:String(v.body||'').trim(),cta:String(v.cta||'').trim(),pairId})));
}
async function runGenerate(){
 if(generating){toast('A batch is already being generated — please wait.');return}
 if(!S.settings.apiKey){toast('Add your API key in Brand Settings, or use Demo drafts.');return}
 const f={...genForm};
 generating=true;genError='';genMsg='Starting…';render();
 const batchId=uid();const created=[];
 try{
  const total=+f.size;const seq=pillarSequence(total);
  for(let i=0;i<total;i+=5){
   const slice=seq.slice(i,i+5);
   genMsg=`Writing ideas ${i+1}–${i+slice.length} of ${total}…`;render();
   const avoid=[...S.posts.slice(0,40),...created].map(p=>p.hook).filter(Boolean).slice(-50);
   let arr=null,lastErr=null;
   for(let at=0;at<2&&!arr;at++){
    try{const txt=await callClaude(systemPrompt(f.lang),batchPrompt(f,slice,avoid),Math.round(slice.length*(f.platform==='Both'?1200:800)*(f.lang==='id'?1.6:1))+1800);
     let r=parseJSON(txt);if(!Array.isArray(r))r=r.posts||r.items||[];if(r.length)arr=r}
    catch(e){lastErr=e;if(/API key|401|404|429|Network|busy/i.test(e.message))throw e}
   }
   if(!arr)throw lastErr||new Error('The AI returned no posts. Please try again.');
   if(!arr.length)throw new Error('The AI returned no posts. Please try again.');
   arr.slice(0,slice.length).forEach(o=>created.push(...toPosts(o,f,batchId)));
  }
 }catch(e){genError=e.message}
 if(created.length){
  S.posts.unshift(...created);
  created.forEach(p=>{if(p.storyId){const s=S.stories.find(x=>x.id===p.storyId);if(s)s.reuse='Used'}});
  save();lastBatch=batchId;
  if(genError)genError=`Saved ${created.length} posts, then stopped: ${genError}`;
  else toast(`${created.length} drafts saved`);
 }
 generating=false;genMsg='';render();
}
function demoGenerate(){
 const n=+genForm.size;const batchId=uid();const used=new Set(S.posts.map(p=>p.hook));
 let pool=IDEAS.filter(([h,pi])=>!used.has(h)&&(genForm.pillar==='mix'||S.pillars[pi]?.id===genForm.pillar));
 if(!pool.length)pool=IDEAS.slice();
 const out=[];
 for(let i=0;i<n;i++){

  const cta=S.ctas.find(c=>c.objective===obj)?.text||'';

  if(genForm.platform==='Both'){const a=mk('Threads'),b=mk('X');a.pairId=b.pairId=uid();out.push(a,b)}else out.push(mk(genForm.platform));

async function aiAction(id,action){
 const p=findPost(id);if(!p)return;
 document.querySelectorAll('details.menu[open]').forEach(d=>d.open=false);
 if(busy[id]){toast('Already working on this post');return}
 if(!S.settings.apiKey){toast('Add your API key in Brand Settings to use AI actions.');return}
 busy[id]=true;render();
 try{
  const targetPlat=action==='adapt'?(p.platform==='X'?'Threads':'X'):p.platform;
  const targetLang=action==='translate'?(p.lang==='id'?'en':'id'):p.lang;
  const stories=action==='personal'?usableStories():[];
  const user=`Current post (${p.platform}, pillar: ${pillarName(p.pillar)}, CTA objective: ${p.ctaObjective||'none'}):
${JSON.stringify({hook:p.hook,body:p.body,cta:p.cta})}

Target platform: ${targetPlat}. ${PLAT_RULES[targetPlat]}

TASK: ${ACTIONS[action].ins}
${action==='personal'?'\nCONFIRMED STORIES:\n'+(stories.length?stories.map(s=>`### ${s.title}\n${s.happened}\nLearned: ${s.learned}`).join('\n\n'):'None — use placeholders only.'):''}

Return ONLY a JSON object: {"hook":"...","body":"...","cta":"..."}`;
  const o=parseJSON(await callClaude(systemPrompt(targetLang),user,2000));
  if(!o||typeof o!=='object'||!('hook' in o))throw new Error('Unexpected AI reply. Try again.');
  if(action==='adapt'||action==='translate'){
   const np=newPost({...p,id:uid(),platform:targetPlat,lang:targetLang,hook:o.hook||'',body:o.body||'',cta:o.cta||'',status:'Draft',date:'',time:'',url:'',metrics:{},createdAt:Date.now(),demo:false,pairId:action==='adapt'?(p.pairId||(p.pairId=uid())):p.pairId});
   S.posts.splice(S.posts.indexOf(p),0,np);toast(action==='adapt'?`New ${targetPlat} variation added`:'Translated copy added');
  }else{
   p.hook=o.hook??p.hook;p.body=o.body??p.body;p.cta=o.cta??p.cta;p.demo=false;
   if(p.status!=='Draft'&&p.status!=='Published'){p.status='Draft';toast('Updated — status reset to Draft for review')}else toast('Updated');
  }
  save();
 }catch(e){toast(e.message,5000)}
 delete busy[id];render();
}

function addIdeaDrafts(ids){

  made.push(newPost({platform:pl,lang:genForm.lang,pillar:i.pillar,hook:i.title,ctaObjective:ctaFor(i.category),product:productFor(i),campaign:genForm.campaign,ideaId:i.id,pairId}))})});
 if(!made.length){toast('Those ideas are already in your drafts.');return}

async function genIdeas(ids){
 if(generating){toast('A batch is already being generated. Please wait.');return}
 let list=ids.map(id=>S.ideas.find(i=>i.id===id)).filter(Boolean);
 if(!list.length)return;
 if(!S.settings.apiKey){toast('Add your API key in Brand Settings, or use “+ Draft”.');return}
 const fresh=list.filter(i=>!S.posts.some(p=>p.ideaId===i.id));
 if(fresh.length&&fresh.length<list.length)list=fresh;
 else if(!fresh.length&&list.length>1&&!confirm('All ideas here already have posts. Generate them again?'))return;
 if(list.some(i=>i.personal)&&!usableStories().length&&!confirm('Some of these ideas are personal, and you have no confirmed story yet.\n\nOK = continue (the AI only uses your founder background and adds [placeholders] for real details).\nCancel = stop, then add and confirm a story in the Story Bank.'))return;
 const f={...genForm,size:String(list.length),pillar:'mix',cta:'Mixed',topic:'',notes:'',productText:''};
 generating=true;genError='';ideaMsg='';genMsg='Starting…';render();
 const batchId=uid();const created=[];
 try{
  for(let i=0;i<list.length;i+=5){
   const part=list.slice(i,i+5);
   genMsg=`Writing posts ${i+1}–${i+part.length} of ${list.length}…`;render();
   const pil=part.map(x=>pillarName(x.pillar));
   const avoid=[...S.posts.slice(0,40),...created].map(p=>p.hook).filter(Boolean).slice(-50);
   let arr=null,lastErr=null;
   for(let at=0;at<2&&!arr;at++){
    try{const txt=await callClaude(systemPrompt(f.lang),batchPrompt(f,pil,avoid,part),Math.round(part.length*(f.platform==='Both'?1200:800)*(f.lang==='id'?1.6:1))+1800);
     let r=parseJSON(txt);if(!Array.isArray(r))r=r.posts||r.items||[];if(r.length)arr=r}
    catch(e){lastErr=e;if(/API key|401|404|429|Network|busy/i.test(e.message))throw e}
   }
   if(!arr)throw lastErr||new Error('The AI returned no posts. Please try again.');
   arr.slice(0,part.length).forEach((o,k)=>{
    const idea=part.find(x=>x.n===Number(o.idea_number))||part[k];if(!idea)return;
    toPosts(o,f,batchId).forEach(p=>{p.ideaId=idea.id;if(!p.pillar)p.pillar=idea.pillar;if(!p.ctaObjective)p.ctaObjective=ctaFor(idea.category);created.push(p)});
   });
  }
 }catch(e){genError=e.message}
 if(created.length){
  S.posts.unshift(...created);
  created.forEach(p=>{if(p.storyId){const s=S.stories.find(x=>x.id===p.storyId);if(s)s.reuse='Used'}});
  save();lastBatch=batchId;
  ideaMsg=`✓ ${created.length} draft${created.length>1?'s':''} saved to the Content Library.`+(genError?` Then it stopped: ${genError}`:'');
  genError='';
 }
 generating=false;genMsg='';render();
}

function confirmStory(id){const s=S.stories.find(x=>x.id===id);if(!s.happened){toast('Add what happened before confirming.');return editStory(id)}if(confirm(`Confirm “${s.title}” is true and OK to use?`)){s.confirmed=true;s.confirmedAt=Date.now();save();render()}}

function genFromStory(id){const s=S.stories.find(x=>x.id===id);if(!s.confirmed){toast('Confirm the story first so the AI can use it.');return}if(s.privacy==='Private'){toast('This story is Private — change privacy to use it.');return}genForm.notes=`Build these posts around the confirmed story “${s.title}” (story, reflection, audience question, and a link to a learning activity).`;genForm.useStories=true;const pl=S.pillars.find(p=>/single mum/i.test(p.name));if(pl)genForm.pillar=pl.id;go('generate')}

VIEWS.topics=()=>{
 const clusters=[...new Set(S.topics.map(t=>t.cluster))];
 return `<div class="row spread"><div><h1>Topic & SEO bank</h1><p class="sub">Keyword ideas are <b>not validated</b> until you check real search data (e.g. Google Search Console). The AI never estimates search volume.</p></div><button class="btn primary" onclick="editTopic()">+ Add keyword</button></div>
 <div class="card" style="margin-bottom:14px"><h3>Expand a seed keyword with AI</h3><div class="row"><input id="seedKw" placeholder="e.g. toddler fine motor activities" style="flex:1;min-width:200px"><select id="seedLang" style="width:auto">${opt('en','English')}${opt('id','Bahasa Indonesia')}</select><button class="btn primary" id="seedBtn" onclick="expandSeed()">✨ Expand</button></div><p class="small">Returns long-tail variations, a post idea and an article outline for each — saved as “Idea”.</p></div>
 ${clusters.length?clusters.map(c=>`<div class="card" style="margin-bottom:12px"><h3>${esc(c)}</h3><div class="tablewrap"><table><tr><th>Keyword</th><th>Intent</th><th>Status</th><th>Product</th><th>Notes</th><th></th></tr>
 ${S.topics.filter(t=>t.cluster===c).map(t=>`<tr><td><b>${esc(t.keyword)}</b></td><td>${esc(t.intent)}</td><td>${t.status==='Validated'?'<span class="okchip">Validated</span>':'<span class="pill">Idea</span>'}</td><td>${esc(productName(t.product))}</td><td class="small" style="max-width:280px;white-space:pre-wrap">${esc((t.notes||'').slice(0,160))}${(t.notes||'').length>160?'…':''}</td><td style="white-space:nowrap"><button class="btn" onclick="useTopic('${t.id}')">Use</button> <button class="btn" onclick="editTopic('${t.id}')">Edit</button></td></tr>`).join('')}</table></div></div>`).join(''):'<div class="empty">No keywords yet.</div>'}`;
};
function useTopic(id){const t=S.topics.find(x=>x.id===id);genForm.topic=t.keyword;if(t.product)genForm.product=t.product;go('generate');toast('Topic added to the generator')}
function editTopic(id){
 const t=id?S.topics.find(x=>x.id===id):{keyword:'',cluster:'',intent:'',status:'Idea',product:'',notes:''};
 openModal(`<h2>${id?'Edit':'New'} keyword</h2>
 <div class="field"><label>Keyword or parent question</label><input id="t_kw" value="${esc(t.keyword)}"></div>
 <div class="grid g2"><div class="field"><label>Cluster</label><input id="t_cluster" list="clList" value="${esc(t.cluster)}"><datalist id="clList">${[...new Set(S.topics.map(x=>x.cluster))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
 <div class="field"><label>Search intent</label><input id="t_intent" value="${esc(t.intent)}" placeholder="e.g. Product discovery"></div>
 <div class="field"><label>Validation</label><select id="t_status">${opt('Idea','Idea — not checked',t.status)}${opt('Validated','Validated with real data',t.status)}</select></div>
 <div class="field"><label>Linked product</label><select id="t_product">${opt('','None',t.product)}${S.products.map(p=>opt(p.id,p.name,t.product)).join('')}</select></div></div>
 <div class="field"><label>Notes (post idea, outline, data source)</label><textarea id="t_notes">${esc(t.notes)}</textarea></div>
 <div class="row spread"><div>${id?`<button class="btn ghost danger" onclick="delTopic('${id}')">Delete</button>`:''}</div><div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTopic('${id||''}')">Save</button></div></div>`);
}
function saveTopic(id){const v=k=>$('#'+k).value.trim();const d={keyword:v('t_kw'),cluster:v('t_cluster')||'Uncategorised',intent:v('t_intent'),status:$('#t_status').value,product:$('#t_product').value,notes:v('t_notes')};if(!d.keyword)return toast('Add a keyword');if(id)Object.assign(S.topics.find(x=>x.id===id),d);else S.topics.unshift({id:uid(),...d});save();closeModal();render()}
function delTopic(id){if(!confirm('Delete keyword?'))return;S.topics=S.topics.filter(t=>t.id!==id);save();closeModal();render()}
let seeding=false;
async function expandSeed(){
 if(seeding)return;const seed=$('#seedKw').value.trim();const lang=$('#seedLang').value;if(!seed)return toast('Type a seed keyword first');
 seeding=true;$('#seedBtn').disabled=true;$('#seedBtn').textContent='Working…';
 try{
  const txt=await callClaude(systemPrompt(lang),`Seed keyword: "${seed}"
Suggest 6 long-tail keyword phrases or parent questions related to this seed, for parents of children aged 2–5. Group them into a short cluster name and label the search intent (e.g. Product discovery, Educational information, Parent problem-solving, Practical parenting, Personal connection). Do NOT estimate search volume or competition.
For each, include one short post idea and a 4–5 heading article outline.
Return ONLY a JSON array: [{"keyword":"","cluster":"","intent":"","post_idea":"","article_outline":["",""]}]`,2500);
  const arr=parseJSON(txt);if(!Array.isArray(arr))throw new Error('Unexpected reply');
  arr.forEach(o=>S.topics.unshift({id:uid(),keyword:o.keyword||'',cluster:o.cluster||seed,intent:o.intent||'',status:'Idea',product:'',notes:`AI suggestion — not validated.\nPost idea: ${o.post_idea||''}\nOutline: ${(o.article_outline||[]).join(' / ')}`}));
  save();toast(`${arr.length} keyword ideas added`);
 }catch(e){toast(e.message,5000)}
 seeding=false;render();
}

VIEWS.campaigns=()=>`<h1>Funnel & CTAs</h1><p class="sub">Not every post sells. Direct sales posts are capped at <b>${esc(S.settings.promoCap)}%</b> (change in Brand Settings).</p>
 <div class="card" style="margin-bottom:14px"><h2>Your funnel</h2><div class="funnel">
 <div><b>1 · Discovery</b>Threads, X, SEO articles, personal stories</div><div><b>2 · Free printable</b>${esc(S.products.find(p=>p.type==='Freebie')?.name||'Add a freebie')}</div><div><b>3 · Email list</b>Permission-based opt-in only</div><div><b>4 · Paid workbooks</b>Feelings, routines, early maths, bundles</div><div><b>5 · Repeat customers</b>Themed, age-specific, seasonal packs</div></div>
 <div class="notice info" style="margin:12px 0 0">A free Gumroad download does <b>not</b> automatically mean someone agreed to marketing emails. Use a clear opt-in checkbox and an unsubscribe link.</div></div>
 <div class="card" style="margin-bottom:14px"><div class="row spread"><h2 style="margin:0">Campaigns</h2><button class="btn primary" onclick="editCampaign()">+ New campaign</button></div>
 ${S.campaigns.length?`<div class="tablewrap"><table style="margin-top:8px"><tr><th>Campaign</th><th>Goal</th><th>Product</th><th>Dates</th><th>Posts</th><th>Clicks</th><th>Sign-ups</th><th>Sales</th><th></th></tr>${S.campaigns.map(c=>{const ps=S.posts.filter(p=>p.campaign===c.id);const s=k=>ps.reduce((a,p)=>a+num(p.metrics?.[k]),0);return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.goal)}</td><td>${esc(productName(c.product))}</td><td class="small">${esc(c.start||'')} → ${esc(c.end||'')}</td><td>${ps.length}</td><td>${s('clicks')}</td><td>${s('signups')}</td><td>${s('sales')}</td><td style="white-space:nowrap"><button class="btn" onclick="copyLinks('${c.id}')">🔗 Links</button> <button class="btn" onclick="editCampaign('${c.id}')">Edit</button></td></tr>`}).join('')}</table></div>`:'<div class="empty" style="margin-top:10px">No campaigns yet. Create one for your freebie launch.</div>'}</div>
 <div class="card"><div class="row spread"><h2 style="margin:0">CTA library</h2><button class="btn" onclick="S.ctas.push({id:uid(),objective:'Conversation',text:''});save();render()">+ Add CTA</button></div><p class="small">The generator uses these as inspiration and varies the wording.</p>
 ${S.ctas.map(c=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><select style="width:170px" onchange="ctaSet('${c.id}','objective',this.value)">${OBJECTIVES.filter(o=>o!=='No CTA').map(o=>opt(o,o,c.objective)).join('')}</select><input style="flex:1;min-width:200px" value="${esc(c.text)}" onchange="ctaSet('${c.id}','text',this.value)"><button class="btn ghost danger" onclick="S.ctas=S.ctas.filter(x=>x.id!=='${c.id}');save();render()">✕</button></div>`).join('')}</div>`;
function ctaSet(id,k,v){S.ctas.find(c=>c.id===id)[k]=v;save()}
function editCampaign(id){
 const c=id?S.campaigns.find(x=>x.id===id):{name:'',goal:'Grow email list',product:'',start:'',end:'',utm:'',landing:'',text:''};
 openModal(`<h2>${id?'Edit':'New'} campaign</h2>
 <div class="field"><label>Name</label><input id="c_name" value="${esc(c.name)}" placeholder="e.g. Big Feelings freebie launch"></div>
 <div class="grid g2"><div class="field"><label>Goal</label><select id="c_goal">${['Grow email list','Sell a product','Build awareness','Start conversations'].map(x=>opt(x,x,c.goal)).join('')}</select></div>
 <div class="field"><label>Product</label><select id="c_product">${opt('','None',c.product)}${S.products.map(p=>opt(p.id,p.name,c.product)).join('')}</select></div>
 <div class="field"><label>Start</label><input type="date" id="c_start" value="${esc(c.start)}"></div><div class="field"><label>End</label><input type="date" id="c_end" value="${esc(c.end)}"></div></div>
 <div class="field"><label>Campaign message / angle (the AI reads this)</label><textarea id="c_text" style="min-height:90px" placeholder="e.g. Promote the new detective series. Focus on curiosity and reading together. No promises about results.">${esc(c.text)}</textarea></div>

}
const slug=s=>String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
function saveCampaign(id){const v=k=>$('#'+k).value.trim();const d={name:v('c_name'),goal:v('c_goal'),product:v('c_product'),start:v('c_start'),end:v('c_end'),landing:v('c_landing'),utm:v('c_utm'),text:v('c_text')};if(!d.name)return toast('Add a name');if(!d.utm)d.utm=slug(d.name);if(id)Object.assign(S.campaigns.find(x=>x.id===id),d);else{const nc={id:uid(),...d};S.campaigns.push(nc);if(view==='generate')genForm.campaign=nc.id}save();closeModal();render()}
function delCampaign(id){if(!confirm('Delete campaign?'))return;S.campaigns=S.campaigns.filter(c=>c.id!==id);S.posts.forEach(p=>{if(p.campaign===id)p.campaign=''});save();closeModal();render()}
function tracked(c,source){const base=c.landing||S.products.find(p=>p.id===c.product)?.url||'';if(!base)return '';try{const u=new URL(base);u.searchParams.set('utm_source',source);u.searchParams.set('utm_medium','social');u.searchParams.set('utm_campaign',c.utm||slug(c.name));return u.toString()}catch(e){return ''}}

 openModal(`<h2>Tracked links · ${esc(c.name)}</h2><p class="small">Use these in posts so clicks can be traced to each platform.</p>
 <div class="field"><label>Threads</label><div class="row"><input readonly value="${esc(t)}" style="flex:1"><button class="btn" onclick="copyText('${esc(t)}')">Copy</button></div></div>
 <div class="field"><label>X</label><div class="row"><input readonly value="${esc(x)}" style="flex:1"><button class="btn" onclick="copyText('${esc(x)}')">Copy</button></div></div>
 <div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="closeModal()">Done</button></div>`)}

VIEWS.analytics=()=>{
 const pub=S.posts.filter(p=>p.status==='Published'||Object.keys(p.metrics||{}).length);
 const sum=(ps,k)=>ps.reduce((a,p)=>a+num(p.metrics?.[k]),0);
 const er=ps=>{const i=sum(ps,'impressions');return i?((sum(ps,'replies')+sum(ps,'reposts')+sum(ps,'likes'))/i*100).toFixed(1)+'%':'—'};
 const group=(keyFn,labelFn)=>{const g={};pub.forEach(p=>{const k=keyFn(p)||'—';(g[k]=g[k]||[]).push(p)});return Object.entries(g).map(([k,ps])=>`<tr><td>${esc(labelFn(k))}</td><td>${ps.length}</td><td>${sum(ps,'impressions').toLocaleString()}</td><td>${er(ps)}</td><td>${sum(ps,'replies')}</td><td>${sum(ps,'clicks')}</td><td>${sum(ps,'signups')}</td><td>${sum(ps,'sales')}</td><td>$${sum(ps,'revenue').toLocaleString()}</td></tr>`).join('')};
 const head='<tr><th></th><th>Posts</th><th>Impressions</th><th>Eng. rate</th><th>Replies</th><th>Clicks</th><th>Sign-ups</th><th>Sales</th><th>Revenue</th></tr>';
 const top=[...pub].sort((a,b)=>(num(b.metrics?.replies)+num(b.metrics?.reposts))-(num(a.metrics?.replies)+num(a.metrics?.reposts))).slice(0,5);
 const toEnter=S.posts.filter(p=>p.status==='Published'||p.status==='Scheduled');
 return `<h1>Analytics</h1><p class="sub">Enter real numbers from Threads, X, your email tool and Gumroad. Nothing here is estimated.</p>
 <div class="grid g4" style="margin-bottom:14px">
  <div class="card stat"><b>${sum(pub,'impressions').toLocaleString()}</b><span>Reach · impressions</span></div>
  <div class="card stat"><b>${(sum(pub,'replies')+sum(pub,'reposts')).toLocaleString()}</b><span>Engagement · rate ${er(pub)}</span></div>
  <div class="card stat"><b>${sum(pub,'clicks')} / ${sum(pub,'signups')}</b><span>Acquisition · clicks / sign-ups</span></div>
  <div class="card stat"><b>$${sum(pub,'revenue').toLocaleString()}</b><span>Revenue · ${sum(pub,'sales')} sales</span></div>
 </div>
 <div class="card" style="margin-bottom:14px"><h2>Record performance</h2><p class="small">Published and scheduled posts. Changes save instantly.</p>
 ${toEnter.length?`<div class="tablewrap"><table><tr><th>Post</th><th>Status</th>${MET.map(([,l])=>`<th>${l}</th>`).join('')}</tr>${toEnter.map(p=>`<tr><td style="min-width:200px"><span class="pill ${p.platform}">${p.platform}</span> ${esc(p.hook.slice(0,60))}${p.hook.length>60?'…':''}<div class="small">${fmtDate(p.date)}</div></td><td><select class="status s-${p.status}" onchange="setStatus('${p.id}',this.value)">${STATUSES.map(s=>opt(s,s,p.status)).join('')}</select></td>${MET.map(([k])=>`<td><input type="number" min="0" step="any" value="${esc(p.metrics?.[k]??'')}" onchange="setMetric('${p.id}','${k}',this.value)"></td>`).join('')}</tr>`).join('')}</table></div>`:'<div class="empty">Mark posts as Published to record their numbers.</div>'}</div>
 ${pub.length?`<div class="card" style="margin-bottom:14px"><h2>By pillar</h2><div class="tablewrap"><table>${head}${group(p=>p.pillar,pillarName)}</table></div></div>
 <div class="grid g2"><div class="card"><h2>By platform</h2><div class="tablewrap"><table>${head}${group(p=>p.platform,k=>k)}</table></div></div>
 <div class="card"><h2>By CTA objective</h2><div class="tablewrap"><table>${head}${group(p=>p.ctaObjective,k=>k)}</table></div></div></div>
 <div class="card" style="margin-top:14px"><h2>Most conversation</h2>${top.map(p=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span class="pill ${p.platform}">${p.platform}</span><span style="flex:1">${esc(p.hook)}</span><span class="small">${num(p.metrics?.replies)} replies · ${num(p.metrics?.reposts)} reposts</span>${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">↗</a>`:''}</div>`).join('')}</div>`:''}`;
};
function setMetric(id,k,v){const p=findPost(id);p.metrics=p.metrics||{};if(v==='')delete p.metrics[k];else p.metrics[k]=num(v);save()}

 <div class="grid g2"><div class="field"><label>Default content language</label><select onchange="S.settings.lang=this.value;genForm.lang=this.value;save();toast('Saved')">${opt('en','English',st.lang)}${opt('id','Bahasa Indonesia',st.lang)}</select></div>
 <div class="field"><label>Max share of direct sales posts (%)</label><input type="number" min="0" max="100" value="${esc(st.promoCap)}" ${set('promoCap')}></div></div>
 <div class="field"><label>Voice & tone</label><textarea ${set('voice')}>${esc(st.voice)}</textarea></div>
 <div class="field"><label>Audience</label><textarea ${set('audience')}>${esc(st.audience)}</textarea></div>
 <div class="field"><label>Founder background (facts the AI may state)</label><textarea ${set('founder')}>${esc(st.founder)}</textarea></div>
 <div class="field"><label>Extra writing rules (one per line)</label><textarea ${set('extraRules')} placeholder="e.g. Use British spelling&#10;Never mention specific schools">${esc(st.extraRules)}</textarea></div>
 <p class="small">Built-in safeguards always apply: no invented stories, testimonials or research; no guaranteed outcomes; no clinical claims; children's details stay private.</p></div>
 <div class="card" style="margin-bottom:14px"><div class="row spread"><h2 style="margin:0">Content pillars</h2><span class="${tot===100?'okchip':'warnchip'}">Targets total ${tot}%</span></div>
 ${S.pillars.map(p=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><input style="flex:1;min-width:180px" value="${esc(p.name)}" onchange="pSet('${p.id}','name',this.value)"><input style="flex:2;min-width:200px" value="${esc(p.desc)}" onchange="pSet('${p.id}','desc',this.value)"><input type="number" style="width:80px" value="${esc(p.target)}" onchange="pSet('${p.id}','target',this.value)"><span>%</span><button class="btn ghost danger" onclick="delPillar('${p.id}')">✕</button></div>`).join('')}
 <button class="btn" style="margin-top:10px" onclick="S.pillars.push({id:uid(),name:'New pillar',desc:'',target:0});save();render()">+ Add pillar</button></div>
 <div class="card"><h2>Your data</h2><p class="small">Everything is saved in this browser. Download a backup regularly — clearing browser data deletes it. Backups do not include your API key.</p>
 <div class="row"><button class="btn" onclick="exportPosts()">⬇ Posts CSV</button><button class="btn" onclick="exportCalendar()">⬇ Calendar CSV</button><button class="btn" onclick="backup()">⬇ Full backup (JSON)</button><label class="btn" style="margin:0;color:var(--ink);font-weight:400">⬆ Restore backup<input type="file" accept=".json,application/json" style="display:none" onchange="restore(this.files[0])"></label><button class="btn ghost danger" onclick="resetAll()">Reset everything</button></div></div>`;
};
function pSet(id,k,v){const p=pillarById(id);p[k]=k==='target'?num(v):v;save();render()}
function delPillar(id){const n=S.posts.filter(p=>p.pillar===id).length;if(!confirm(`Delete this pillar?${n?` ${n} posts will become Unassigned.`:''}`))return;S.pillars=S.pillars.filter(p=>p.id!==id);S.posts.forEach(p=>{if(p.pillar===id)p.pillar=''});(S.ideas||[]).forEach(i=>{if(i.pillar===id)i.pillar=''});save();render()}
async function testKey(){toast('Testing…');try{const t=await callClaude('Reply with the single word OK.','Ping',10);toast('Connected ✓ '+t.trim().slice(0,20))}catch(e){toast(e.message,5000)}}

/* ============ Export / backup ============ */
function exportPosts(){
 const head=['id','status','platform','language','pillar','hook','body','cta','full_text','cta_objective','seo_terms','product','campaign','story','reuse_suggestion','date','time','published_url',...MET.map(m=>m[0]),'created'];
 const rows=S.posts.map(p=>[p.id,p.status,p.platform,p.lang==='id'?'Indonesian':'English',pillarName(p.pillar),p.hook,p.body,p.cta,fullText(p),p.ctaObjective,(p.seo||[]).join('; '),productName(p.product),campaignName(p.campaign),S.stories.find(s=>s.id===p.storyId)?.title||'',p.reuse,p.date,p.time,p.url,...MET.map(([k])=>p.metrics?.[k]??''),new Date(p.createdAt).toISOString()]);
 download(`mums-wisdom-posts-${ymd(new Date())}.csv`,csv([head,...rows]),'text/csv');
}
function exportCalendar(){
 const ps=S.posts.filter(p=>p.date).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 if(!ps.length)return toast('No posts on the calendar yet.');
 download(`mums-wisdom-calendar-${ymd(new Date())}.csv`,csv([['date','time','platform','status','pillar','hook','full_text','campaign','published_url'],...ps.map(p=>[p.date,p.time,p.platform,p.status,pillarName(p.pillar),p.hook,fullText(p),campaignName(p.campaign),p.url])]),'text/csv');
}
function backup(){const c=JSON.parse(JSON.stringify(S));c.settings.apiKey='';download(`mums-wisdom-backup-${ymd(new Date())}.json`,JSON.stringify(c,null,2),'application/json')}
function restore(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.posts)||!d.settings)throw 0;if(!confirm(`Restore backup with ${d.posts.length} posts? This replaces current data (your API key is kept).`))return;const key=S.settings.apiKey;S=d;S.settings.apiKey=key;(function(){const df=defaults();for(const k of Object.keys(df))if(S[k]===undefined)S[k]=df[k]})();ensureIdeas();save();render();toast('Backup restored')}catch(e){toast('That file is not a valid Mum\'s Wisdom backup.')}};r.readAsText(file)}
function resetAll(){if(!confirm('Delete ALL posts, stories, products and settings in this browser?'))return;if(!confirm('Are you sure? Download a backup first if unsure.'))return;S=defaults();ensureIdeas();save();lastBatch='';render();toast('Reset complete')}

document.addEventListener('click',e=>{document.querySelectorAll('details.menu[open]').forEach(d=>{if(!d.contains(e.target))d.open=false})});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
</body>
